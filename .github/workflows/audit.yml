name: audit

# 사람이 갱신을 잊기 쉬운 항목(은퇴일·단가 재확인·권장값 상태)을 주 1회 점검해 이슈 1건으로 알린다.
# 시크릿 없음. 입력은 레포 파일뿐(외부 이벤트 페이로드를 셸에 넣지 않는다).
on:
  schedule:
    - cron: "0 0 * * 1"   # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 외부 액션은 태그가 아닌 커밋 SHA 로 고정한다 (태그는 옮겨질 수 있다).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/audit.py > report.md
      - name: 이슈 열기·갱신·닫기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.AUDIT_ASSIGNEE }}
        run: |
          gh label create audit --color FBCA04 --description "정기 점검" --force
          num=$(gh issue list --label audit --state open --json number --jq '.[0].number // empty')
          if [ -s report.md ]; then
            { echo "정기 점검에서 확인이 필요한 항목입니다. 실행: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; echo; cat report.md; } > body.md
            if [ -n "$num" ]; then
              gh issue edit "$num" --body-file body.md
            else
              gh issue create --title "정기 점검: 목록 확인 필요" --label audit --body-file body.md ${ASSIGNEE:+--assignee "$ASSIGNEE"}
            fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "정기 점검에서 확인할 항목이 없어 닫습니다."
          fi
